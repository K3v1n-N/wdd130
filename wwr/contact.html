<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>&#128640;Rocket Rapids Rafting&#128640;</title>

    <meta name="description"
        content="This is the home page for an awesome white water rafting experience, of course it is a fictitious website that I have built for education purposes only. But, lets not let that stand in the way of navigating an awesome rafting website.">
    <meta name="author" content="Kevin Noorda">

    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body> <!--added header class and div logo class, also shifting nav in horizontal pattern next to image-->
    <header class="header">
        <!-- removed <div class="logo">MyLogo</div> from this space-->
        <img src="images/logo.png" alt="Website Logo" class="logo"><!--A rafting site logo-->
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <!--Need to change the hero image and paragraph content 30nov2025, also pulling hero image -->
    <main>
        <div class="hero"><!--hero image updated-->
            <img src="images/hero.jpg" alt="background image">
            <h1>Rocket Rapids Rafting</h1>
            <article>
                <!--Using paragraph section for company info-->
                <p>123 Rocket Street</p>
                <p>River, Utah</p>
                <p>(801) 123-4567</p>
                <p>info@rocketrapids.com</p>
            </article>
        </div>
        <!--Changing history to HTML form for signing up with name, email, etc-->
        <section> <!--adding centering class-->

            <!--Google embed map-->

            <div class="contact-layout">

                <!-- LEFT: Google Map | original size width = 600 height = 450-->
                <div class="map-container">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d96641.96541374744!2d-113.82540095!3d40.804644100000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80ac39c47cd112bd%3A0x4076930f09544f7a!2sBonneville%20Salt%20Flats!5e0!3m2!1sen!2sus!4v1764549891670!5m2!1sen!2sus"
                        width="300" height="225" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

                <form class="contact-form" action="#" method="post">
                    <!-- Name -->
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Your Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <!-- Purpose (Radio Buttons) -->
                    <fieldset class="form-group">
                        <legend>Purpose of Your Message</legend>

                        <label>
                            <input type="radio" name="purpose" value="general-inquiry" required>
                            General Inquiry
                        </label><br>

                        <label>
                            <input type="radio" name="purpose" value="reservation-question">
                            Reservation Question
                        </label><br>

                        <label>
                            <input type="radio" name="purpose" value="website-suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <!-- Message -->
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <!-- Newsletter Checkbox -->
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="subscribe" name="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn">
                        Submit
                    </button>

                </form>
        </section>
        <!--Changing from adventure awaits to we are here to serve you-->
        <section class="center-h3"> <!--changing adventure awaits you from h2 to h3, hopefully add images later-->
            <h3>We Are Here To Serve You</h3> <!--adding centering class-->
            <div class="image-row">
                <figure class="photo">
                    <img src="images/employ1.jpeg" alt="Employee 1">
                    <figcaption>Brows</figcaption>
                </figure>
                <figure class="photo">
                    <img src="images/employ2.jpeg" alt="Employee 2">
                    <figcaption>Shades</figcaption>
                </figure>
                <figure class="photo">
                    <img src="images/employ3.jpeg" alt="Employee 3">
                    <figcaption>Stache</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <!--23nov2025 adding code to change footer layout-->
    <footer class="footer">
        <div class="footer-text">
            <p> © 2025| Rocket Rapids Rafting |Kevin Noorda| </p>
        </div>

        <div class="footer-icons">

            <img src="images/faccebook.png" alt="Facebook logo"><!-- facebook icon-->

            <img src="images/linkedin.png" alt="linkedin logo"><!--Linkedin icon-->

            <img src="images/instagram.png" alt="Instagram icon"><!--instagram icon-->

        </div>

    </footer>

</body>
